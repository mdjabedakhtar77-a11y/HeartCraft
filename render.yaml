services:
  - type: web
    name: heartcraft
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MYSQL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
