services:
  # ---------------------------------------------------------
  # 1. Standalone Backend Web Service (Node.js / Express API)
  # ---------------------------------------------------------
  - type: web
    name: heartcraft-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MYSQL
        value: "false"
      - key: JWT_SECRET
        generateValue: true

  # ---------------------------------------------------------
  # 2. Standalone Frontend Static Site (React / Vite)
  # ---------------------------------------------------------
  - type: static
    name: heartcraft-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: heartcraft-backend
          envVarKey: RENDER_EXTERNAL_URL
